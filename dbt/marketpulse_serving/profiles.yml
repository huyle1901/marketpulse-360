marketpulse_serving:
  target: local
  outputs:
    local:
      type: clickhouse
      driver: http
      host: "{{ env_var('CLICKHOUSE_HOST', 'clickhouse') }}"
      port: "{{ env_var('CLICKHOUSE_PORT', '8123') | int }}"
      user: "{{ env_var('CLICKHOUSE_USER', 'marketpulse') }}"
      password: "{{ env_var('DBT_ENV_SECRET_CLICKHOUSE_PASSWORD') }}"
      schema: "{{ env_var('BATCH_CANDIDATE_DATABASE') }}"
      threads: 2
      secure: false
      custom_settings:
        join_use_nulls: 1
        max_threads: 2
