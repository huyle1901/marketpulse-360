global:
  scrape_interval: 5s
  scrape_timeout: 4s
  evaluation_interval: 5s
rule_files:
  - /etc/prometheus/alerts.yml
scrape_configs:
  - job_name: api
    authorization:
      credentials_file: /run/secrets/metrics_token
    static_configs:
      - targets: ['api:8000']
  - job_name: collector
    authorization:
      credentials_file: /run/secrets/metrics_token
    static_configs:
      - targets: ['collector:9100']
