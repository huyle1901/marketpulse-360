name: marketpulse-360

services:
  kafka:
    image: apache/kafka:4.3.1
    profiles:
      - streaming
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: CONTROLLER://:29093,PLAINTEXT://:29092,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:29092 --list >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  topic-init:
    image: apache/kafka:4.3.1
    profiles:
      - streaming
    depends_on:
      kafka:
        condition: service_healthy
    volumes:
      - ./docker/kafka/create-topics.sh:/opt/marketpulse/create-topics.sh:ro
    entrypoint: ["/bin/bash", "/opt/marketpulse/create-topics.sh"]
    restart: "no"

  schema-registry:
    image: apicurio/apicurio-registry:3.3.3
    profiles:
      - streaming
    ports:
      - "8081:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/health/ready"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:v1.5.0
    profiles:
      - streaming
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: marketpulse-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      DYNAMIC_CONFIG_ENABLED: "false"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q UP"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  replay:
    build:
      context: .
      dockerfile: docker/replay/Dockerfile
    profiles:
      - tools
    depends_on:
      kafka:
        condition: service_healthy
      topic-init:
        condition: service_completed_successfully
      schema-registry:
        condition: service_healthy
    volumes:
      - ./data:/app/data:ro
    entrypoint: ["marketpulse-mock"]

  flink-jobmanager:
    image: marketpulse-360/flink-job:2.2.1
    build:
      context: .
      dockerfile: docker/flink/Dockerfile
    profiles:
      - flink
    command: jobmanager
    depends_on:
      kafka:
        condition: service_healthy
      topic-init:
        condition: service_completed_successfully
    ports:
      - "8082:8081"
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        rest.address: 0.0.0.0
        rest.bind-address: 0.0.0.0
        jobmanager.memory.process.size: 768m
        taskmanager.numberOfTaskSlots: 2
        parallelism.default: 2
        state.checkpoints.dir: file:///opt/flink/checkpoints
    volumes:
      - flink_checkpoints:/opt/flink/checkpoints
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8081/overview >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 896M

  flink-taskmanager:
    image: marketpulse-360/flink-job:2.2.1
    build:
      context: .
      dockerfile: docker/flink/Dockerfile
    profiles:
      - flink
    command: taskmanager
    depends_on:
      kafka:
        condition: service_healthy
      flink-jobmanager:
        condition: service_healthy
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        taskmanager.memory.process.size: 1024m
        taskmanager.numberOfTaskSlots: 2
        parallelism.default: 2
        state.checkpoints.dir: file:///opt/flink/checkpoints
    volumes:
      - flink_checkpoints:/opt/flink/checkpoints
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://flink-jobmanager:8081/taskmanagers | grep -q taskmanagers"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 1280M

  flink-job-submit:
    image: marketpulse-360/flink-job:2.2.1
    build:
      context: .
      dockerfile: docker/flink/Dockerfile
    profiles:
      - flink
    depends_on:
      kafka:
        condition: service_healthy
      topic-init:
        condition: service_completed_successfully
      flink-jobmanager:
        condition: service_healthy
      flink-taskmanager:
        condition: service_healthy
    environment:
      FLINK_JOBMANAGER_URL: http://flink-jobmanager:8081
      FLINK_JOB_NAME: marketpulse-stream-v1
    entrypoint: ["/opt/flink/bin/submit-marketpulse-job"]
    command:
      - --bootstrap-servers=kafka:29092
      - --group-id=marketpulse-flink-v1
      - --checkpoint-uri=file:///opt/flink/checkpoints
      - --checkpoint-interval-ms=5000
      - --watermark-ms=300000
      - --idleness-ms=60000
      - --correction-horizon-ms=600000
      - --session-gap-ms=1800000
      - --dedup-ttl-ms=604800000
      - --parallelism=2
      - --transaction-prefix=marketpulse-flink-v1-
      - --job-name=marketpulse-stream-v1
    restart: "no"

volumes:
  kafka_data:
  flink_checkpoints:
