name: marketpulse-360

x-batch-runtime: &batch-runtime
  image: marketpulse-360/batch:mp05
  build:
    context: .
    dockerfile: docker/batch/Dockerfile
  profiles: [batch]
  environment: &batch-environment
    DAGSTER_POSTGRES_USER: ${DAGSTER_POSTGRES_USER:-dagster}
    DAGSTER_POSTGRES_DB: ${DAGSTER_POSTGRES_DB:-dagster}
    DAGSTER_POSTGRES_PASSWORD: "${DAGSTER_POSTGRES_PASSWORD:-}"
    CLICKHOUSE_HOST: clickhouse
    CLICKHOUSE_PORT: "8123"
    CLICKHOUSE_USER: ${CLICKHOUSE_USER:-marketpulse}
    CLICKHOUSE_PASSWORD: "${CLICKHOUSE_PASSWORD:-}"
    MINIO_ENDPOINT: http://minio:9000
    MINIO_REGION: us-east-1
    AWS_REGION: us-east-1
    MINIO_ROOT_USER: ${MINIO_ROOT_USER:-marketpulse}
    MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:?}"
    NESSIE_URI: http://nessie:19120/api/v2
    NESSIE_REF: main
    ICEBERG_WAREHOUSE: s3://marketpulse-lakehouse/warehouse
    KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    SPARK_MASTER: local[2]
    SPARK_DRIVER_MEMORY: 2g
    SPARK_SQL_SHUFFLE_PARTITIONS: "2"
    BATCH_SOURCE_ROOT: ${BATCH_SOURCE_ROOT:-/opt/marketpulse/data/mock/fixtures/seed-360}
  volumes:
    - ./data:/opt/marketpulse/data:ro
    - batch_state:/opt/marketpulse/batch-state
    - dagster_home:/opt/marketpulse/dagster-home
    - ./docker/batch/dagster.yaml:/opt/marketpulse/dagster-home/dagster.yaml:ro

services:
  clickhouse:
    image: clickhouse/clickhouse-server:26.8.25.14@sha256:dd81097e2c38827a438287d8ae5d4dc8afafbdd0e61e83376fdd7ed4580673b9
    profiles: [serving]
    ports:
      - "127.0.0.1:${CLICKHOUSE_HOST_PORT:-8123}:8123"
    environment:
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-marketpulse}
      CLICKHOUSE_PASSWORD: "${CLICKHOUSE_PASSWORD:-}"
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./docker/batch/clickhouse-entrypoint.sh:/opt/marketpulse/clickhouse-entrypoint.sh:ro
    entrypoint: ["/bin/bash", "/opt/marketpulse/clickhouse-entrypoint.sh"]
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --user \"$${CLICKHOUSE_USER}\" --password \"$${CLICKHOUSE_PASSWORD}\" --query 'SELECT 1' >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 2048M

  batch-postgres:
    image: postgres:17.6-alpine
    profiles: [batch]
    environment:
      POSTGRES_USER: ${DAGSTER_POSTGRES_USER:-dagster}
      POSTGRES_DB: ${DAGSTER_POSTGRES_DB:-dagster}
      POSTGRES_PASSWORD: "${DAGSTER_POSTGRES_PASSWORD:-}"
    volumes:
      - batch_metadata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  batch-code:
    <<: *batch-runtime
    depends_on:
      batch-postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "dagster", "api", "grpc-health-check", "-h", "localhost", "-p", "4000"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 4096M

  dagster-webserver:
    <<: *batch-runtime
    command: ["dagster-webserver", "-h", "0.0.0.0", "-p", "3000", "-w", "/opt/marketpulse/workspace.yaml"]
    ports:
      - "127.0.0.1:${DAGSTER_HOST_PORT:-3000}:3000"
    depends_on:
      batch-postgres:
        condition: service_healthy
      batch-code:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:3000/server_info', timeout=5)"]
      interval: 10s
      timeout: 10s
      retries: 30
    deploy:
      resources:
        limits:
          memory: 768M

  dagster-daemon:
    <<: *batch-runtime
    command: ["dagster-daemon", "run", "-w", "/opt/marketpulse/workspace.yaml"]
    depends_on:
      batch-postgres:
        condition: service_healthy
      batch-code:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 768M

  kafka:
    image: apache/kafka:4.3.1
    profiles:
      - streaming
    ports:
      - "${KAFKA_HOST_PORT:-9092}:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: CONTROLLER://:29093,PLAINTEXT://:29092,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:29092 --list >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  topic-init:
    image: apache/kafka:4.3.1
    profiles:
      - streaming
    depends_on:
      kafka:
        condition: service_healthy
    volumes:
      - ./docker/kafka/create-topics.sh:/opt/marketpulse/create-topics.sh:ro
    entrypoint: ["/bin/bash", "/opt/marketpulse/create-topics.sh"]
    restart: "no"

  schema-registry:
    image: apicurio/apicurio-registry:3.3.3
    profiles:
      - streaming
    ports:
      - "${REGISTRY_HOST_PORT:-8081}:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/health/ready"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:v1.5.0
    profiles:
      - streaming
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "${KAFKA_UI_HOST_PORT:-8080}:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: marketpulse-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      DYNAMIC_CONFIG_ENABLED: "false"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q UP"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  replay:
    build:
      context: .
      dockerfile: docker/replay/Dockerfile
    profiles:
      - tools
    depends_on:
      kafka:
        condition: service_healthy
      topic-init:
        condition: service_completed_successfully
      schema-registry:
        condition: service_healthy
    volumes:
      - ./data:/app/data:ro
    entrypoint: ["marketpulse-mock"]

  flink-jobmanager:
    image: marketpulse-360/flink-job:2.2.1
    build:
      context: .
      dockerfile: docker/flink/Dockerfile
    profiles:
      - flink
    command: jobmanager
    depends_on:
      kafka:
        condition: service_healthy
      topic-init:
        condition: service_completed_successfully
    ports:
      - "${FLINK_HOST_PORT:-8082}:8081"
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        rest.address: 0.0.0.0
        rest.bind-address: 0.0.0.0
        jobmanager.memory.process.size: 768m
        taskmanager.numberOfTaskSlots: 2
        parallelism.default: 2
        state.checkpoints.dir: file:///opt/flink/checkpoints
    volumes:
      - flink_checkpoints:/opt/flink/checkpoints
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8081/overview >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 896M

  flink-taskmanager:
    image: marketpulse-360/flink-job:2.2.1
    build:
      context: .
      dockerfile: docker/flink/Dockerfile
    profiles:
      - flink
    command: taskmanager
    depends_on:
      kafka:
        condition: service_healthy
      flink-jobmanager:
        condition: service_healthy
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        taskmanager.memory.process.size: 1024m
        taskmanager.numberOfTaskSlots: 2
        parallelism.default: 2
        state.checkpoints.dir: file:///opt/flink/checkpoints
    volumes:
      - flink_checkpoints:/opt/flink/checkpoints
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://flink-jobmanager:8081/taskmanagers | grep -q taskmanagers"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 1280M

  flink-job-submit:
    image: marketpulse-360/flink-job:2.2.1
    build:
      context: .
      dockerfile: docker/flink/Dockerfile
    profiles:
      - flink
    depends_on:
      kafka:
        condition: service_healthy
      topic-init:
        condition: service_completed_successfully
      flink-jobmanager:
        condition: service_healthy
      flink-taskmanager:
        condition: service_healthy
    environment:
      FLINK_JOBMANAGER_URL: http://flink-jobmanager:8081
      FLINK_JOB_NAME: marketpulse-stream-v1
    entrypoint: ["/opt/flink/bin/submit-marketpulse-job"]
    command:
      - --bootstrap-servers=kafka:29092
      - --group-id=marketpulse-flink-v1
      - --checkpoint-uri=file:///opt/flink/checkpoints
      - --checkpoint-interval-ms=${FLINK_CHECKPOINT_INTERVAL_MS:-5000}
      - --watermark-ms=300000
      - --idleness-ms=${FLINK_IDLENESS_MS:-60000}
      - --correction-horizon-ms=600000
      - --session-gap-ms=1800000
      - --dedup-ttl-ms=604800000
      - --parallelism=2
      - --transaction-prefix=marketpulse-flink-v1-
      - --job-name=marketpulse-stream-v1
    restart: "no"

  lakehouse-postgres:
    image: postgres:17.6-alpine
    profiles:
      - lakehouse
    environment:
      POSTGRES_DB: nessie
      POSTGRES_USER: ${LAKEHOUSE_POSTGRES_USER:-nessie}
      POSTGRES_PASSWORD: "${LAKEHOUSE_POSTGRES_PASSWORD:?}"
    volumes:
      - lakehouse_catalog:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

  minio:
    image: marketpulse-360/minio:RELEASE.2025-04-22T22-12-26Z
    build:
      context: .
      dockerfile: docker/minio/Dockerfile.server
    profiles:
      - lakehouse
    command: ["server", "/data", "--console-address", ":9001"]
    ports:
      - "${MINIO_API_HOST_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_HOST_PORT:-9001}:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-marketpulse}
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:?}"
    volumes:
      - lakehouse_data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

  minio-init:
    image: marketpulse-360/mc:RELEASE.2025-05-21T01-59-54Z
    build:
      context: .
      dockerfile: docker/minio/Dockerfile.client
    profiles:
      - lakehouse
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ENDPOINT: http://minio:9000
      MINIO_BUCKET: marketpulse-lakehouse
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-marketpulse}
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:?}"
    volumes:
      - ./docker/minio/create-bucket.sh:/opt/marketpulse/create-bucket.sh:ro
    entrypoint: ["/bin/sh", "/opt/marketpulse/create-bucket.sh"]
    restart: "no"

  nessie:
    image: ghcr.io/projectnessie/nessie:0.109.0
    profiles:
      - lakehouse
    depends_on:
      lakehouse-postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    ports:
      - "${NESSIE_HOST_PORT:-19120}:19120"
    environment:
      NESSIE_VERSION_STORE_TYPE: JDBC2
      NESSIE_VERSION_STORE_PERSIST_JDBC_DATASOURCE: postgresql
      QUARKUS_DATASOURCE_POSTGRESQL_JDBC_URL: jdbc:postgresql://lakehouse-postgres:5432/nessie
      QUARKUS_DATASOURCE_POSTGRESQL_USERNAME: ${LAKEHOUSE_POSTGRES_USER:-nessie}
      QUARKUS_DATASOURCE_POSTGRESQL_PASSWORD: "${LAKEHOUSE_POSTGRES_PASSWORD:?}"
      NESSIE_SERVER_DEFAULT_BRANCH: main
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/q/health/ready >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s

  spark-lakehouse:
    build:
      context: .
      dockerfile: docker/lakehouse/Dockerfile
    image: marketpulse-360/spark-lakehouse:4.0.4-iceberg-1.12.0
    profiles:
      - lakehouse-tools
    depends_on:
      minio-init:
        condition: service_completed_successfully
      nessie:
        condition: service_healthy
    environment:
      SPARK_MASTER: local[2]
      SPARK_DRIVER_MEMORY: ${SPARK_DRIVER_MEMORY:-2g}
      SPARK_SQL_SESSION_TIMEZONE: UTC
      SPARK_SQL_SHUFFLE_PARTITIONS: "2"
      NESSIE_URI: http://nessie:19120/api/v2
      NESSIE_REF: main
      ICEBERG_WAREHOUSE: s3://marketpulse-lakehouse/warehouse
      MINIO_ENDPOINT: http://minio:9000
      MINIO_REGION: us-east-1
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-marketpulse}
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:?}"
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-marketpulse}
      AWS_SECRET_ACCESS_KEY: "${MINIO_ROOT_PASSWORD:?}"
      AWS_REGION: us-east-1
    volumes:
      - ./data:/opt/marketpulse/data:ro
      - lakehouse_evidence:/opt/marketpulse/evidence
    deploy:
      resources:
        limits:
          memory: ${SPARK_CONTAINER_MEMORY_LIMIT:-2560M}

volumes:
  kafka_data:
  flink_checkpoints:
  lakehouse_data:
  lakehouse_catalog:
  lakehouse_evidence:
  clickhouse_data:
  batch_metadata:
  batch_state:
  dagster_home:
