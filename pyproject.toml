[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "marketpulse-360-data"
version = "0.2.0"
description = "Reproducible marketing source simulation and governed lakehouse tools"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
kafka = ["confluent-kafka==2.16.0"]
lakehouse = ["boto3==1.43.111", "confluent-kafka==2.16.0"]
batch = [
    "dagster==1.13.26",
    "dagster-webserver==1.13.26",
    "dagster-dbt==0.29.26",
    "dagster-postgres==0.29.26",
    "dbt-core==1.12.5",
    "dbt-clickhouse==1.10.3",
    "clickhouse-connect==1.10.0",
    "psycopg[binary]==3.3.4",
]

[project.scripts]
marketpulse-mock = "marketpulse_mock.cli:main"
marketpulse-lakehouse = "marketpulse_lakehouse.cli:main"
marketpulse-batch = "marketpulse_batch.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
marketpulse_batch = ["sql/*.sql"]
